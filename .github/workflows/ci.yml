name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: orca-ide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name orca -e ORCA_PAIRING_ADDRESS=127.0.0.1 orca-ide:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' orca)" = healthy ] && exit 0
            docker logs orca 2>&1 | grep -q 'Orca server ready' && exit 0
            sleep 5
          done
          docker logs orca; exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orca-ide:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
